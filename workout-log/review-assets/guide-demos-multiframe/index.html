<h1>动作素材库 · 多帧候选</h1>
<p class="intro">原九项扩为多帧，另备六种动作。共十五组、100 个帧位（含回到起始姿势的帧）。普通动作六帧，Y–T–W 与三向触点每阶段四帧，共十二帧；静蹲四帧进入后保持。</p>
<p class="notice">AI 动作示意候选，尚未接入生产。不是实拍或已通过专业动作审查的教学视频。可逐帧检查人物、器械与接触点；切帧速度只用于预览，不是训练节奏。</p>
<div class="controls"><button id="pause-all" type="button">全部暂停</button><a href="README.md">查看逐项核验与接入说明</a><a href="prompts.json">生成提示词</a><a href="corrections.json">修正提示词</a></div>
<p class="small">系统“减少动态效果”下默认静态；点击播放可主动查看。仅屏幕内的卡片自动换帧，静蹲默认显示保持姿势。预览无第三方请求。</p>
<h2>本次补齐 · 原九项</h2><div class="grid" id="current"></div>
<h2>预备素材 · 另外六项</h2><p>预备素材不代表加入训练计划，也不替换现有实拍动作。</p><div class="grid" id="reserve"></div>

const reduced=window.matchMedia('(prefers-reduced-motion: reduce)');
const players=[];
function make(d){
 const card=document.createElement('section');card.className='card';card.id=d.key;
 const h=document.createElement('h3');h.textContent=d.title;card.append(h);
 const caption=document.createElement('p');caption.className='caption';caption.textContent='AI 动作示意 · '+d.frameCount+' 帧 · '+(d.group==='current'?'补齐候选':'预备候选');card.append(caption);
 const phases=document.createElement('div');phases.className='controls phases';phases.setAttribute('role','group');phases.setAttribute('aria-label',d.title+'阶段');
 const media=document.createElement('div');media.className='media';media.style.aspectRatio=(d.width/d.cols)+' / '+(d.height/d.rows);media.style.setProperty('--w',(d.cols*100)+'%');media.style.setProperty('--h',(d.rows*100)+'%');media.setAttribute('role','img');
 const img=document.createElement('img');img.src=d.file;img.alt='';img.setAttribute('aria-hidden','true');img.loading='lazy';media.append(img);
 img.onerror=()=>{state.playing=false;error.hidden=false;render();};
 const error=document.createElement('p');error.hidden=true;error.className='error';error.textContent='素材加载失败，请用下方链接查看原图。';
 const label=document.createElement('span');label.className='frame-label';
 const controls=document.createElement('div');controls.className='controls';controls.setAttribute('role','group');controls.setAttribute('aria-label',d.title+'播放控制');
 const play=document.createElement('button'),prev=document.createElement('button'),next=document.createElement('button');
 play.type=prev.type=next.type='button';prev.textContent='上一帧';next.textContent='下一帧';controls.append(play,prev,next);
 const state={phase:0,pos:d.defaultFrame,playing:!d.hold&&!reduced.matches,visible:false,last:0};const phaseButtons=[];
 const currentSeq=()=>d.sequences[state.phase].indices;
 function render(){
  const seq=currentSeq(),idx=seq[state.pos],row=Math.floor(idx/d.cols),col=idx%d.cols;
  img.style.left=(-col*100)+'%';img.style.top=(-row*100)+'%';
  label.textContent=d.sequences[state.phase].title+' · 第 '+(state.pos+1)+' / '+seq.length+' 帧'+(d.hold&&state.pos===seq.length-1?' · 保持姿势':'');
  media.setAttribute('aria-label',d.title+'，'+label.textContent);
  play.textContent=state.playing?'暂停':d.hold?'重播进入过程':'播放';
  play.setAttribute('aria-pressed',String(state.playing));
  phaseButtons.forEach((b,i)=>b.setAttribute('aria-pressed',String(i===state.phase)));
 }
 for(const [i,s] of d.sequences.entries()){const b=document.createElement('button');b.type='button';b.textContent=s.title;b.onclick=()=>{state.phase=i;state.pos=0;state.last=0;render();};phaseButtons.push(b);phases.append(b);}
 if(d.sequences.length>1)card.append(phases);card.append(media,error,label,controls);
 play.onclick=()=>{if(d.hold&&state.pos===currentSeq().length-1)state.pos=0;state.playing=!state.playing;state.last=performance.now();render();};
 function step(delta){state.playing=false;const n=currentSeq().length;state.pos=(state.pos+delta+n)%n;render();}
 prev.onclick=()=>step(-1);next.onclick=()=>step(1);
 const notes=document.createElement('p');notes.className='notes';notes.textContent=d.notes;card.append(notes);
 const status=document.createElement('p');status.className='status';status.textContent='候选待整批过目 · 未上线 · 接入前仍须检查帧间配准与实际动作';card.append(status);
 const a=document.createElement('a');a.href=d.file;a.textContent='查看完整分镜原图';card.append(a);
 const player={card,state,render,tick(now){if(!state.playing||!state.visible||document.hidden)return;if(!state.last){state.last=now;return;}if(now-state.last<(d.hold?850:600))return;state.last=now;const n=currentSeq().length;if(d.hold&&state.pos===n-1){state.playing=false;render();return;}state.pos=(state.pos+1)%n;render();}};
 players.push(player);document.getElementById(d.group).append(card);render();return player;
}
for(const d of demos)make(d);
const observer=new IntersectionObserver(entries=>{for(const e of entries){const p=players.find(p=>p.card===e.target);if(p){p.state.visible=e.isIntersecting;p.state.last=0;}}},{threshold:0.15});
players.forEach(p=>observer.observe(p.card));
setInterval(()=>{const now=performance.now();players.forEach(p=>p.tick(now));},100);
document.getElementById('pause-all').onclick=()=>players.forEach(p=>{p.state.playing=false;p.render();});
reduced.addEventListener('change',e=>{if(e.matches)players.forEach(p=>{p.state.playing=false;p.render();});});
</script>
